# ============================================================
#  Energy Copilot AI — MQTT Broker Config (Mosquitto)
#  Брокер для приёма данных с IoT оборудования
# ============================================================

# Основной порт MQTT
listener 1883

# WebSocket порт (для браузерных клиентов)
listener 9001
protocol websockets

# Файл с паролями пользователей
password_file /mosquitto/config/passwd

# Запретить анонимный доступ
allow_anonymous false

# Постоянное хранение сообщений
persistence true
persistence_location /mosquitto/data/

# Логирование
log_dest stdout
log_type all

# Максимальный размер сообщения (10 MB)
message_size_limit 10485760


