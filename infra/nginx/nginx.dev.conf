# ============================================================
#  Energy Copilot AI — Nginx Dev Config
#  Направляет запросы к нужным сервисам
# ============================================================

events {
    worker_connections 1024;
}

http {
    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Таймауты для WebSocket и длинных запросов
    proxy_read_timeout    300;
    proxy_connect_timeout 300;
    proxy_send_timeout    300;

    # ── Upstream серверы ──────────────────────────────────────
    upstream backend {
        server api:8000;
    }
    upstream ai_service {
        server ai:8001;
    }
    upstream frontend {
        server web:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M;

        # ── API Backend: /api/* → FastAPI ──────────────────────
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket: /ws/* → FastAPI ────────────────────────
        location /ws/ {
            proxy_pass         http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ── AI Service: /ai/* → AI microservice ──────────────
        location /ai/ {
            proxy_pass         http://ai_service/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Frontend: всё остальное → Next.js ─────────────────
        location / {
            proxy_pass         http://frontend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Next.js Hot Reload через WebSocket
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
