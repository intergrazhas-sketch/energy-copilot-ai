# ============================================================
#  Energy Copilot AI — Local Development Stack
#  Запуск: docker compose up --build
# ============================================================

version: "3.9"

# ── Общая сеть для всех сервисов ────────────────────────────
networks:
  ec_network:
    driver: bridge

# ── Постоянное хранение данных ──────────────────────────────
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mqtt_data:

# ============================================================
services:

  # ──────────────────────────────────────────────────────────
  # 1. POSTGRESQL + TIMESCALEDB
  #    Главная база данных платформы.
  #    TimescaleDB — расширение для хранения телеметрии
  #    (миллионы записей по времени, быстрые запросы).
  # ──────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-energy_copilot}
      POSTGRES_USER:     ${POSTGRES_USER:-ec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ec_secret_password}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ec_user} -d ${POSTGRES_DB:-energy_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 2. REDIS
  #    Быстрый кэш + очередь задач (Celery) + pub/sub
  #    для WebSocket уведомлений в реальном времени.
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ec_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ec_redis_password} --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ec_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ec_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 3. QDRANT
  #    Векторная база данных для AI Engineer (RAG).
  #    Хранит документы и мануалы в виде векторов —
  #    это позволяет AI находить нужную информацию
  #    по смыслу, а не по ключевым словам.
  # ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ec_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-ec_qdrant_key}
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 4. MQTT BROKER (Eclipse Mosquitto)
  #    Протокол связи для IoT оборудования.
  #    Инверторы, датчики и контроллеры отправляют
  #    телеметрию через MQTT на этот брокер.
  #    Backend подписывается и сохраняет данные в БД.
  # ──────────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ec_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (без TLS — только для dev)
      - "9001:9001"   # MQTT через WebSocket
    volumes:
      - mqtt_data:/mosquitto/data
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mqtt/passwd:/mosquitto/config/passwd:ro
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t 'health' -m 'ok' -u ${MQTT_USER:-ec_mqtt} -P ${MQTT_PASSWORD:-ec_mqtt_password} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 5. FASTAPI BACKEND
  #    Основной API сервер платформы.
  #    Обрабатывает все запросы: авторизация, активы,
  #    телеметрия, аварии, отчёты.
  # ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: ec_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:     postgresql+asyncpg://${POSTGRES_USER:-ec_user}:${POSTGRES_PASSWORD:-ec_secret_password}@postgres:5432/${POSTGRES_DB:-energy_copilot}
      REDIS_URL:        redis://:${REDIS_PASSWORD:-ec_redis_password}@redis:6379/0
      QDRANT_HOST:      qdrant
      QDRANT_PORT:      "6333"
      QDRANT_API_KEY:   ${QDRANT_API_KEY:-ec_qdrant_key}
      MQTT_HOST:        mqtt
      MQTT_PORT:        "1883"
      MQTT_USER:        ${MQTT_USER:-ec_mqtt}
      MQTT_PASSWORD:    ${MQTT_PASSWORD:-ec_mqtt_password}
      SECRET_KEY:       ${SECRET_KEY:-change_this_in_production_very_long_secret}
      ENVIRONMENT:      development
      AI_SERVICE_URL:   http://ai:8001
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 6. AI SERVICE
  #    Отдельный микросервис для AI-функций:
  #    - Forecast Intelligence Engine
  #    - Forecast Accuracy Lab
  #    - AI Engineer (RAG)
  #    - Predictive Maintenance
  #    Вынесен отдельно чтобы масштабировать независимо.
  # ──────────────────────────────────────────────────────────
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
      target: development
    container_name: ec_ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL:       postgresql+asyncpg://${POSTGRES_USER:-ec_user}:${POSTGRES_PASSWORD:-ec_secret_password}@postgres:5432/${POSTGRES_DB:-energy_copilot}
      REDIS_URL:          redis://:${REDIS_PASSWORD:-ec_redis_password}@redis:6379/1
      QDRANT_HOST:        qdrant
      QDRANT_PORT:        "6333"
      QDRANT_API_KEY:     ${QDRANT_API_KEY:-ec_qdrant_key}
      # AI провайдеры — добавь свои ключи в .env
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY:     ${GEMINI_API_KEY:-}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-openai}
      ENVIRONMENT:        development
    volumes:
      - ./apps/ai:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # 7. NEXT.JS FRONTEND
  #    Интерфейс платформы.
  #    Поддерживает Russian / Kazakh / English с первого дня.
  # ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: ec_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL:      http://localhost:8000
      NEXT_PUBLIC_WS_URL:       ws://localhost:8000
      NEXT_PUBLIC_APP_NAME:     "Energy Copilot AI"
      NEXT_PUBLIC_DEFAULT_LANG: ru
    volumes:
      - ./apps/web:/app
      - /app/node_modules          # не перезаписывать node_modules хоста
      - /app/.next                 # не перезаписывать .next кэш
    networks:
      - ec_network

  # ──────────────────────────────────────────────────────────
  # 8. NGINX
  #    Входная точка для всего трафика.
  #    В dev режиме работает как reverse proxy:
  #    /api/* → backend:8000
  #    /ai/*  → ai:8001
  #    /*     → frontend:3000
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ec_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - ec_network
